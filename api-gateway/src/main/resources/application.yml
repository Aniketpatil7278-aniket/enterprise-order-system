server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          routes:

            # ==============================
            # USER SERVICE
            # ==============================

            - id: user-service

              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

              filters:
                - StripPrefix=1


            # ==============================
            # ORDER SERVICE
            # ==============================

            - id: order-service

              uri: http://localhost:8082

              predicates:
                - Path=/api/orders/**

              filters:
                - StripPrefix=1


            # ==============================
            # PAYMENT SERVICE
            # ==============================

            - id: payment-service

              uri: http://localhost:8083

              predicates:
                - Path=/api/payments/**

              filters:
                - StripPrefix=1


            # ==============================
            # INVENTORY SERVICE
            # ==============================

            - id: inventory-service

              uri: http://localhost:8084

              predicates:
                - Path=/api/inventory/**

              filters:
                - StripPrefix=1


# ==========================================
# ACTUATOR
# ==========================================

management:

  endpoint:

    gateway:
      access: read-only

    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway